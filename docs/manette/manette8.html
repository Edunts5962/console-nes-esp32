        let gpView = "all";         /* "all" | "fav" | "rec" */

        function gpCrc16(bytes) {
            let crc = 0xFFFF;
            for (let i = 0; i < bytes.length; i++) {
                crc ^= bytes[i] << 8;
                for (let k = 0; k < 8; k++) {
                    crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
                }
            }
            return crc;
        }

        function gpQueue(frame) {
            pendingSystemFrames.push(frame);
            processGattQueue();
        }

        function gpSetMsg(text, isError) {
            gpMsg.textContent = text || "";
            gpMsg.classList.toggle("gp-err", Boolean(isError));
        }

        function gpSetGames(games, gen, mode) {
            gpGames = games;
            gpGen = gen;
            gpMode = mode;
            gpGamesVersion++;
        }

        function gpClearGames() {
            gpSelected = -1;
            gpSetGames([], -1, gpMode);
        }

        /* Jeu en cours, en index de gpGames (-1 : aucun). */
        function gpCurrentIndex() {
            if (gpConsole.state <= 0) {
                return -1;
            }
            return gpMode === "cat" ? gpConsole.catcur : gpConsole.current;
        }

        /* Liste complète si la console la propose (ÉTAT de 12 octets),
           en donnant la liste déjà reçue : la console ne la renvoie pas si
           elle n'a pas changé. Sinon, l'ancienne liste (page de 50 jeux). */
        function gpListFrame() {
            if (!gpConsole.cat) {
                return NES_LIST_FRAME;
            }
            if (gpCache) {
                return [0xFD, 0x07, gpCache.gen & 0xFF, gpCache.crc & 0xFF, (gpCache.crc >> 8) & 0xFF, 0x00];
            }
            return NES_LIST_ALL_FRAME;
        }

        /* Sans nouvelles de la liste depuis 4 s (rien reçu, ou réception
           arrêtée en route) : nouvelle demande, 3 au plus. */
        function gpArmListTimer() {
            clearTimeout(gpListTimer);
            gpListTimer = setTimeout(() => {
                if (!gpOpenFlag || !gpWaiting) {
                    return;
                }
                if (gpRetries < 3 && gamesCharacteristic) {
                    gpRetries++;
                    gpRequestList();
                } else {
                    gpWaiting = false;
                    gpRx = null;
                    if (gpGen < 0) {
                        gpSetMsg("La console ne répond pas : fermez puis rouvrez la liste.", true);
                    }
                }
            }, 4000);
        }

        function gpRequestList() {
            gpRx = null;
            gpWaiting = true;
            gpWaitingMode = gpConsole.cat ? "cat" : "page";
            gpArmListTimer();
            gpQueue(gpListFrame());
        }

        /* Bibliothèque valable pour la liste affichée ? */
        function gpLibOk() {
            return Boolean(gpLib && gpMode === "cat" && gpGen >= 0 && gpLib.gen === gpGen);
        }

        /* Ordre des jeux affichés selon la liste choisie. */
        function gpOrder() {
            if (gpLibOk() && gpView === "fav") {
                return gpLib.fav.filter(i => i < gpGames.length);
            }
            if (gpLibOk() && gpView === "rec") {
                return gpLib.rec.filter(i => i < gpGames.length);
            }
            return gpGames.map((g, i) => i);
        }

        /* Recherche : mots sans accents ni majuscules, tous présents dans le nom. */
        function gpNorm(text) {
            return text.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
        }

        function gpWords() {
            return gpNorm(gpFilter).split(/\s+/).filter(Boolean);
        }

        function gpMatches(game, words) {
            return words.every(w => game.key.indexOf(w) >= 0);
        }

        function gpStateText() {
            const cur = gpCurrentIndex();
            const game = cur >= 0 ? gpGames[cur] : null;
            let text;
            switch (gpConsole.state) {
                case 0: text = "Console : menu des jeux"; break;
                case 1: text = game ? "En cours : " + game.label : "Partie en cours"; break;
                case 2: text = game ? "En pause : " + game.label : "Partie en pause"; break;
                default: return "Liste en cours de chargement…";
            }
            if (gpGames.length) {
                text += " · " + gpGames.length + (gpGames.length > 1 ? " jeux" : " jeu");
            }
            return text;
        }

        function gpEmptyText() {
            if (gpGames.length && gpLibOk() && gpView !== "all" && !gpFilter.trim()) {
                return gpView === "fav"
                    ? "Aucun favori : touche l'étoile ☆ d'un jeu dans « Tous »."
                    : "Aucun jeu lancé récemment.";
            }
            if (gpGames.length) {
                return "Aucun jeu ne correspond à « " + gpFilter.trim() + " ».";
            }
            if (gpGen < 0) {
                if (gpRx && gpRx.buf && gpRx.len) {
                    return "Réception de la liste… " + Math.floor(gpRx.next * 100 / gpRx.len) + " %";
                }
                return "Chargement de la liste…";
            }
            return "Aucun jeu sur la console.";
        }

        /* Lignes de la liste, reconstruites seulement si la liste, la
           recherche ou le jeu en cours changent (1000 jeux possibles) ; la
           position de défilement est gardée. */
        function gpBuildList() {
            const keep = gpList.scrollTop;
            const frag = document.createDocumentFragment();
            const cur = gpCurrentIndex();
            const words = gpWords();
            let shown = 0;
            let curRow = null;

            const libOk = gpLibOk();
            gpOrder().forEach(i => {
                const game = gpGames[i];
                if (!game || (words.length && !gpMatches(game, words))) {
                    return;
                }
                shown++;
                const row = document.createElement("button");
                row.type = "button";
                row.className = "gp-row";
                row.setAttribute("role", "option");
                row.setAttribute("aria-selected", i === gpSelected ? "true" : "false");
                row.dataset.index = String(i);

                const name = document.createElement("span");
                name.className = "gp-name";
                name.textContent = game.label;

                if (i === cur) {
                    const tag = document.createElement("span");
                    tag.className = "gp-tag gp-tag-cur";
                    tag.textContent = "EN COURS";
                    name.appendChild(tag);
                    curRow = row;
                }

                if (game.bad) {
                    const tag = document.createElement("span");
                    tag.className = "gp-tag gp-tag-bad";
                    tag.textContent = "!";
                    name.appendChild(tag);
                }

                const meta = document.createElement("span");
                meta.className = "gp-meta";
                meta.textContent = (game.where === "F" ? "Interne" : "SD") + " · " + game.kb + " Ko";

                row.appendChild(name);
                row.appendChild(meta);
                if (libOk) {   /* Étoile des favoris */
                    const on = gpLib.favSet.has(i);
                    const star = document.createElement("span");
                    star.className = "gp-star" + (on ? " on" : "");
                    star.setAttribute("role", "button");
                    star.setAttribute("aria-label", on ? "Retirer des favoris" : "Ajouter aux favoris");
                    star.dataset.star = String(i);
                    star.textContent = on ? "★" : "☆";
                    row.appendChild(star);
                }
                frag.appendChild(row);
            });

            gpEmptyEl = null;
            if (!shown) {
                gpEmptyEl = document.createElement("div");
                gpEmptyEl.className = "gp-empty";
                gpEmptyEl.textContent = gpEmptyText();
                frag.appendChild(gpEmptyEl);
            }

            gpList.textContent = "";
            gpList.appendChild(frag);
            gpList.scrollTop = keep;

            if (gpScrollPending && gpGames.length) {
                gpScrollPending = false;
                if (curRow) {
                    const lr = gpList.getBoundingClientRect();
                    const rr = curRow.getBoundingClientRect();
                    gpList.scrollTop += rr.top - lr.top - (gpList.clientHeight - rr.height) / 2;
                } else {
                    gpList.scrollTop = 0;
                }
            }
        }

        function gpUpdateSelection() {
            gpList.querySelectorAll(".gp-row").forEach(row => {
                row.setAttribute("aria-selected", parseInt(row.dataset.index, 10) === gpSelected ? "true" : "false");
            });
        }

        /* Onglets Tous / Favoris / Récents et carte « Reprendre » */
        function gpRenderLib() {
            const ok = gpLibOk();
            gpChips.hidden = !ok;
            if (!ok && gpView !== "all") {
                gpView = "all";
            }
            gpChips.querySelectorAll(".gp-chip").forEach(b => {
                b.setAttribute("aria-pressed", b.dataset.view === gpView ? "true" : "false");
                if (ok && b.dataset.view === "fav") {
                    b.textContent = "★ Favoris" + (gpLib.fav.length ? " " + gpLib.fav.length : "");
                }
            });
            const r = ok ? gpLib.resume : -1;
            const game = r >= 0 ? gpGames[r] : null;
            const running = gpConsole.state > 0 && gpCurrentIndex() === r;
            const show = Boolean(game) && !running && !gpFilter.trim() && gpView !== "fav";
            gpResumeBtn.hidden = !show;
            if (show) {
                gpResumeBtn.querySelector(".gp-resume-name").textContent = "▶ Reprendre · " + game.label;
                gpResumeBtn.querySelector(".gp-resume-sub").textContent = gpLib.resumeState
                    ? "La partie repart là où tu l'as quittée"
                    : "Dernier jeu joué";
                gpResumeBtn.disabled = gpLaunching >= 0;
            }
        }

        function gpRender() {
            gpState.textContent = gpStateText();
            gpRenderLib();
            const key = [gpGamesVersion, gpFilter, gpCurrentIndex(), gpGen < 0, gpGames.length,
                         gpLibVersion, gpView, gpLibOk()].join("|");
            if (key !== gpListKey) {
                gpListKey = key;
                gpBuildList();
            } else {
                gpUpdateSelection();
            }
            gpSearch.placeholder = gpGames.length > 1
                ? "🔍 Rechercher parmi " + gpGames.length + " jeux"
                : "🔍 Rechercher un jeu";
            gpLaunchBtn.disabled = gpSelected < 0 || gpLaunching >= 0 || gpGen < 0;
        }

        function gpParseList(bytes) {
            const text = new TextDecoder("utf-8").decode(bytes);
            const games = [];

            text.split("\n").forEach(line => {
                if (!line) {
                    return;
                }
                const parts = line.split("\t");
                if (parts.length < 3) {
                    return;
                }
                const flags = parts[0];
                const name = parts.slice(2).join("\t");
                const label = name.replace(/\.nes$/i, "");
                games.push({
                    name,
                    label,
                    key: gpNorm(label),
                    where: flags.charAt(0),
                    bad: flags.indexOf("!") >= 0,
                    kb: parseInt(parts[1], 10) || 0
                });
            });

            return games;
        }

        /* Liste reçue en entier (ou confirmée inchangée) : affichée, le jeu
           choisi reste choisi s'il y est encore. */
        function gpListReceived(games, gen, mode) {
            clearTimeout(gpListTimer);
            gpWaiting = false;
            gpRetries = 0;
            const prev = gpSelected >= 0 && gpGames[gpSelected] ? gpGames[gpSelected] : null;
            if (games !== gpGames || mode !== gpMode) {
                gpSetGames(games, gen, mode);
            } else {
                gpGen = gen;
            }
            gpSelected = prev ? gpGames.findIndex(g => g.name === prev.name && g.where === prev.where) : -1;
            if (gpSelected >= 0 && gpFilter && !gpMatches(gpGames[gpSelected], gpWords())) {
                gpSelected = -1;
            }
            if (gpMsg.classList.contains("gp-err") && gpLaunching < 0) {
                gpSetMsg("");
            }
            log("Liste des jeux reçue : " + gpGames.length + " jeu(x)" +
                (mode === "cat" ? " (liste complète)." : " (page de la console)."));
            if (gpOpenFlag) {
                gpRender();
            }
        }

        /* Liste illisible : nouvelle demande (3 au plus). */
        function gpListFailed() {
            log("Liste des jeux incomplète : nouvelle demande.");
            if (gpRetries < 3) {
                gpRetries++;
                gpRequestList();
            } else {
                gpWaiting = false;
                clearTimeout(gpListTimer);
                gpSetMsg("Liste des jeux illisible : fermez puis rouvrez la liste.", true);
            }
        }

        function gpShowProgress() {
            if (gpOpenFlag && gpEmptyEl && gpGen < 0) {
                gpEmptyEl.textContent = gpEmptyText();
            }
        }

        function onGamesNotification(event) {
            const v = event.target.value;
            const b = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);

            if (!b.length) {
                return;
            }

            if (b[0] === 0x01 && b.length >= 6) {
                /* ÉTAT */
                const cur = b[2] | (b[3] << 8);
                const cat = b.length >= 12;   /* Liste complète proposée */
                const catcur = cat ? (b[7] | (b[8] << 8)) : 0xFFFF;
                gpConsole = {
                    state: b[1], current: cur === 0xFFFF ? -1 : cur, gen: b[4], count: b[5],
                    tv: b.length >= 7 && (b[6] & 0x01) !== 0,   /* Liste sur la télévision */
                    cat,
                    catcur: catcur === 0xFFFF ? -1 : catcur,
                    catgen: cat ? b[9] : -1,
                    total: cat ? (b[10] | (b[11] << 8)) : 0
                };
                showConsoleVolume(b.length >= 13 ? b[12] : null);   
                if (gpOpenFlag && !gpRx) {
                    const wantCat = gpConsole.cat;
                    if (gpGen >= 0) {
                        const listGen = wantCat ? gpConsole.catgen : gpConsole.gen;
                        if ((gpMode === "cat") !== wantCat || gpGen !== listGen) {
                            /* Liste relue (ou page changée) sur la console : on la redemande. */
                            gpClearGames();
                            gpRequestList();
                        }
                    } else if (gpWaiting && (gpWaitingMode === "cat") !== wantCat) {
                        gpRequestList();
                    }
                }
                if (gpOpenFlag) {
                    gpRender();
                }
            } else if (b[0] === 0x02 && b.length >= 5) {
                /* DÉBUT DE LISTE (page de la console) */
                if (gpWaitingMode !== "page") {
                    return;
                }
                const len = b[3] | (b[4] << 8);
                gpRx = { mode: "page", gen: b[1], len, buf: new Uint8Array(len), next: 0, gap: false };
                gpArmListTimer();
            } else if (b[0] === 0x03 && b.length >= 4) {
                /* MORCEAU */
                if (!gpRx || gpRx.mode !== "page" || b[1] !== gpRx.gen) {
                    return;
                }
                const off = b[2] | (b[3] << 8);
                const data = b.subarray(4);
                if (off === gpRx.next && off + data.length <= gpRx.len) {
                    gpRx.buf.set(data, off);
                    gpRx.next += data.length;
                } else if (off > gpRx.next) {
                    gpRx.gap = true;   /* morceau manquant */
                }   /* sinon doublon : ignoré */
                gpArmListTimer();
            } else if (b[0] === 0x04 && b.length >= 4) {
                /* FIN DE LISTE */
                if (!gpRx || gpRx.mode !== "page" || b[1] !== gpRx.gen) {
                    return;
                }
                const rx = gpRx;
                gpRx = null;
                const crc = b[2] | (b[3] << 8);
                if (rx.gap || rx.next !== rx.len || gpCrc16(rx.buf) !== crc) {
                    gpListFailed();
                    return;
                }
                gpListReceived(gpParseList(rx.buf), rx.gen, "page");
            } else if (b[0] === 0x06 && b.length >= 7) {
                /* DÉBUT DE LA LISTE COMPLÈTE */
                if (gpWaitingMode !== "cat") {
                    return;
                }
                const len = b[4] | (b[5] << 8) | (b[6] << 16);
                const unchanged = b.length >= 8 && (b[7] & 0x01) !== 0;
                gpRx = {
                    mode: "cat", gen: b[1], count: b[2] | (b[3] << 8), len,
                    buf: unchanged ? null : new Uint8Array(len), next: 0, gap: false, unchanged
                };
                gpArmListTimer();
                gpShowProgress();
            } else if (b[0] === 0x07 && b.length >= 5) {
                /* MORCEAU (position sur 3 octets) */
                if (!gpRx || gpRx.mode !== "cat" || !gpRx.buf || b[1] !== gpRx.gen) {
                    return;
                }
                const off = b[2] | (b[3] << 8) | (b[4] << 16);
                const data = b.subarray(5);
                if (off === gpRx.next && off + data.length <= gpRx.len) {
                    gpRx.buf.set(data, off);
                    gpRx.next += data.length;
                } else if (off > gpRx.next) {
                    gpRx.gap = true;
                }
                gpArmListTimer();
                gpShowProgress();
            } else if (b[0] === 0x08 && b.length >= 4) {
                /* FIN DE LA LISTE COMPLÈTE */
                if (!gpRx || gpRx.mode !== "cat" || b[1] !== gpRx.gen) {
                    return;
                }
                const rx = gpRx;
                gpRx = null;
                const crc = b[2] | (b[3] << 8);
                if (rx.unchanged) {
                    if (gpCache && gpCache.gen === rx.gen && gpCache.crc === crc) {
                        gpListReceived(gpCache.games, rx.gen, "cat");
                    } else {
                        gpCache = null;   /* ne devrait pas arriver : liste entière redemandée */
                        gpListFailed();
                    }
                    return;
                }
                if (rx.gap || rx.next !== rx.len || gpCrc16(rx.buf) !== crc) {
                    gpListFailed();
                    return;
                }
                const games = gpParseList(rx.buf);
                gpCache = { gen: rx.gen, crc, games };
                gpListReceived(games, rx.gen, "cat");
            } else if (b[0] === 0x09 && b.length >= 4) {
                /* BIBLIOTHÈQUE - favoris (0), récents (1), puis
                   « Reprendre » (2), qui termine l'envoi. */
                const kind = b[2];
                if (kind <= 1 && b.length >= 5) {
                    const key = kind === 0 ? "fav" : "rec";
                    if (b[4] === 0) {
                        gpLibRx[key] = [];
                    }
                    if (gpLibRx[key].length === b[4]) {
                        for (let i = 5; i + 1 < b.length; i += 2) {
                            gpLibRx[key].push(b[i] | (b[i + 1] << 8));
                        }
                    }
                } else if (kind === 2 && b.length >= 6) {
                    const r = b[4] | (b[5] << 8);
                    gpLib = {
                        gen: b[1],
                        fav: gpLibRx.fav,
                        rec: gpLibRx.rec,
                        favSet: new Set(gpLibRx.fav),
                        resume: r === 0xFFFF ? -1 : r,
                        resumeState: (b[3] & 0x01) !== 0
                    };
                    gpLibRx = { fav: [], rec: [] };
                    gpLibVersion++;
                    if (gpOpenFlag) {
                        gpRender();
                    }
                }
            } else if (b[0] === 0x05 && b.length >= 4) {
                /* ÉVÉNEMENT */
                const code = b[1];
                const a = b[2] | (b[3] << 8);
                /* Numéro dans la liste complète (octets 4-5) */
                const ca = b.length >= 6 ? (b[4] | (b[5] << 8)) : 0xFFFF;
                const gi = gpMode === "cat" ? (ca === 0xFFFF ? -1 : ca) : a;

                if (code === 1) {
                    const game = gi >= 0 ? gpGames[gi] : null;
                    gpSetMsg("Chargement" + (game ? " de « " + game.label + " »" : "") + "…");
                    if (gpLaunching >= 0 && gi === gpLaunching) {
                        gpArmLaunchTimeout(gi, 15000);   /* accepté : le chargement peut durer */
                    }
                } else if (code === 2) {
                    gpConsole.current = a === 0xFFFF ? -1 : a;
                    if (gpMode === "cat") {
                        gpConsole.catcur = gi;
                    }
                    const game = gi >= 0 ? gpGames[gi] : null;
                    const asked = gpLaunching >= 0 ||
                        (gpAsked && gpAsked.index === gi && Date.now() - gpAsked.time < 30000);
                    clearTimeout(gpLaunchTimer);
                    gpLaunching = -1;
                    gpAsked = null;
                    if (gpFallback) {
                        /* Retour au jeu précédent après un échec : le panneau
                           reste ouvert (message d'erreur), le jeu en pause. */
                        gpFallback = false;
                        if (gpOpenFlag) {
                            gpQueue([0xFD, 0x05, 0x01, 0x00]);
                            gpRender();
                        }
                    } else if (asked) {
                        log("Jeu lancé : " + (game ? game.label : "n° " + gi));
                        vibrate([30, 30, 30]);
                        gpClose(false);   /* le nouveau jeu tourne déjà */
                    } else if (gpOpenFlag) {
                        /* Jeu lancé depuis l'écran de la console : on joue. */
                        log("Jeu lancé sur la console : " + (game ? game.label : "n° " + gi));
                        gpClose(true);
                    }
                } else if (code === 3) {
                    const reason = b[2];
                    let text = (GP_REFUSE_TEXT[reason] || "Lancement refusé par la console.")
                        .replace("{d}", String(b[3]));
                    if (reason === 6) {
                        gpFallback = b[3] === 1;
                        if (!gpFallback) {
                            text = GP_LOAD_FAILED_MENU_TEXT;
                        }
                    }
                    log("Lancement refusé : " + text);
                    clearTimeout(gpLaunchTimer);
                    gpLaunching = -1;
                    gpAsked = null;
                    gpSetMsg(text, true);
                    vibrate([60, 40, 60]);
                    if (reason === 1) {
                        gpClearGames();
                        gpRequestList();
                    }
                    if (gpOpenFlag) {
                        gpRender();
                    }
                }
            }
        }

        /* Appelée par connectToDevice() : abonnement à FFF2 si la console
           le propose.
           - Caractéristique absente (NotFoundError) : console plus ancienne,
             MENU JEUX garde son fonctionnement d'avant.
           - Liaison perdue pendant l'abonnement : l'erreur remonte, la
             connexion échoue (et la reconnexion automatique reprend).
           - Autre erreur passagère : un second essai.
           Les écritures de la manette attendent la fin de l'abonnement :
           deux opérations GATT simultanées échouent sur Android. */
        async function setupGamesCharacteristic(device) {
            gamesCharacteristic = null;
            gattWriteInProgress = true;
            try {
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        const ch = await nesService.getCharacteristic(NES_GAMES_CHAR_UUID);
                        ch.addEventListener("characteristicvaluechanged", onGamesNotification);
                        await ch.startNotifications();
                        gamesCharacteristic = ch;
                        log("Liste des jeux disponible : MENU JEUX l'ouvre sur le téléphone.");
                        return;
                    } catch (error) {
                        if (!device.gatt || !device.gatt.connected) {
                            throw error;
                        }
                        if (error.name === "NotFoundError") {
                            log("Pas de liste des jeux (programme de la console avant v2.13) : MENU JEUX garde son fonctionnement d'avant.");
                            return;
                        }
                        log("Abonnement à la liste des jeux : " + error.name + " — " + error.message);
                        if (attempt < 2) {
                            await new Promise(resolve => setTimeout(resolve, 300));
                        }
                    }
                }
                log("Liste des jeux indisponible pour cette connexion : MENU JEUX garde son fonctionnement d'avant.");
            } finally {
                gattWriteInProgress = false;
            }
        }

        function gpOpen() {
            if (gpOpenFlag) {
                return;
            }
            gpOpenFlag = true;
            releaseAllButtons();
            gpSelected = -1;
            gpLaunching = -1;
            gpAsked = null;
            gpFallback = false;
            clearTimeout(gpLaunchTimer);
            gpRetries = 0;
            gpFilter = "";
            gpSearch.value = "";
            gpSheet.classList.remove("gp-filtering");
            clearTimeout(gpFilterTimer);
            /* Liste complète déjà reçue et toujours valable (même
               numéro de catalogue) : affichée tout de suite ; la console
               confirme ensuite qu'elle n'a pas changé (sans la renvoyer). */
            if (gpConsole.cat && gpCache && gpCache.gen === gpConsole.catgen) {
                gpSetGames(gpCache.games, gpCache.gen, "cat");
            } else {
                gpClearGames();
            }
            gpScrollPending = true;
            gpListKey = null;
            gpSetMsg("");
            gpPanel.hidden = false;
            gpRender();
            gpQueue([0xFD, 0x05, 0x01, 0x00]);   /* pause (sans effet dans les menus de la console) */
            gpRequestList();
            vibrate(20);
            log("Liste des jeux ouverte (partie en pause).");
        }

        function gpClose(resume) {
            if (!gpOpenFlag) {
                return;
            }
            gpOpenFlag = false;
            gpSearch.blur();   /* Clavier refermé */
            gpPanel.hidden = true;
            clearTimeout(gpListTimer);
            gpWaiting = false;
            gpDisarmConsole();
            if (resume && gamesCharacteristic) {
                gpQueue([0xFD, 0x05, 0x00, 0x00]);   /* reprise */
            }
        }

        function gpDisarmConsole() {
            gpConsoleArmedUntil = 0;
            clearTimeout(gpConsoleTimer);
            gpConsoleTimer = null;
            gpConsoleBtn.textContent = "🏠 MENU DE LA CONSOLE";
        }

        /* Liaison coupée / rétablie (resetConnection(), onLinkUp()). */
        function gpOnLinkDown() {
            gpRx = null;
            gpWaiting = false;
            gpLaunching = -1;
            gpAsked = null;
            gpFallback = false;
            clearTimeout(gpLaunchTimer);
            /* La console a pu redémarrer (et sa liste changer) : la liste
               affichée ne sert plus à lancer un jeu avant d'être reçue de
               nouveau. Elle reste visible en attendant. */
            gpGen = -1;
            if (gpOpenFlag) {
                gpSetMsg("Liaison avec la console perdue…", true);
                gpRender();
            }
        }

        function gpOnLinkUp() {
            if (!gpOpenFlag) {
                return;
            }
            if (!gamesCharacteristic) {
                gpClose(false);
                return;
            }
            gpSetMsg("");
            gpQueue([0xFD, 0x05, 0x01, 0x00]);
            gpRequestList();
        }

        gpList.addEventListener("click", event => {
            /* Étoile -> favori (ajouté ou retiré sur la console) */
            const star = event.target.closest(".gp-star");
            if (star) {
                event.stopPropagation();
                if (!gpLibOk() || !gamesCharacteristic) {
                    return;
                }
                const i = parseInt(star.dataset.star, 10);
                const on = !gpLib.favSet.has(i);
                if (on && gpLib.fav.length >= 60) {
                    gpSetMsg("60 favoris au plus : retire d'abord une étoile.", true);
                    return;
                }
                if (on) {
                    gpLib.favSet.add(i);
                    gpLib.fav = gpLib.fav.concat([i]).sort((x, y) => x - y);
                } else {
                    gpLib.favSet.delete(i);
                    gpLib.fav = gpLib.fav.filter(x => x !== i);
                }
                gpLibVersion++;
                playClickSound();
                vibrate(15);
                gpQueue([0xFD, 0x09, gpGen & 0xFF, i & 0xFF, (i >> 8) & 0xFF, 0x00]);
                gpRender();
                return;
            }
            const row = event.target.closest(".gp-row");
            if (!row || gpLaunching >= 0) {
                return;
            }
            gpSelected = parseInt(row.dataset.index, 10);
            playClickSound();
            gpSearch.blur();   /* Clavier refermé, LANCER visible */
            gpRender();
            const game = gpGames[gpSelected];
            gpSetMsg(game && game.bad ? "Attention : ce jeu a déjà fait planter la console." : "");
        });

        /* En paysage, la page bloque le défilement (touchmove) : pas dans la liste. */
        gpList.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });

        /* Recherche dans la liste (tous les mots, sans tenir compte
           des accents ni des majuscules). */
        function gpSheetHold() {
            gpSheet.classList.toggle("gp-filtering", gpSearch.value !== "" || document.activeElement === gpSearch);
        }
        gpSearch.addEventListener("focus", gpSheetHold);
        /* Au départ du champ, le panneau garde sa hauteur un instant :
           un appui sur un onglet ou un bouton sous le champ (qui fait
           partir le clavier) n'est pas perdu dans le changement de taille. */
        gpSearch.addEventListener("blur", () => setTimeout(gpSheetHold, 350));
        gpSearch.addEventListener("input", () => {
            gpSheetHold();
            clearTimeout(gpFilterTimer);
            gpFilterTimer = setTimeout(() => {
                gpFilter = gpSearch.value;
                if (gpSelected >= 0 && gpGames[gpSelected] && !gpMatches(gpGames[gpSelected], gpWords())) {
                    gpSelected = -1;
                    gpSetMsg("");
                }
                gpList.scrollTop = 0;
                if (gpOpenFlag) {
                    gpRender();
                }
            }, 120);
        });
        gpSearch.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();
                gpSearch.blur();
            }
        });
        gpSearch.addEventListener("touchmove", event => event.stopPropagation(), { passive: true });

        /* Sans réponse dans le délai, le choix redevient possible (une
           confirmation tardive ferme quand même le panneau : gpAsked). */
        function gpArmLaunchTimeout(asked, ms) {
            clearTimeout(gpLaunchTimer);
            gpLaunchTimer = setTimeout(() => {
                if (gpLaunching === asked) {
                    gpLaunching = -1;
                    gpSetMsg("Pas de réponse de la console.", true);
                    if (gpOpenFlag) {
                        gpRender();
                    }
                }
            }, ms);
        }

        gpLaunchBtn.addEventListener("click", () => {
            if (gpSelected < 0 || gpLaunching >= 0 || gpGen < 0 || !gamesCharacteristic) {
                return;
            }
            playClickSound();
            const asked = gpSelected;
            const game = gpGames[asked];
            gpLaunching = asked;
            gpAsked = { index: asked, time: Date.now() };
            gpFallback = false;
            gpSetMsg("Lancement de « " + game.label + " »…");
            gpRender();
            /* Liste complète -> numéro du catalogue (LANCER 0x08) */
            gpQueue([0xFD, gpMode === "cat" ? 0x08 : 0x04, gpGen & 0xFF, asked & 0xFF, (asked >> 8) & 0xFF, 0x00]);
            log("LANCER : " + game.label);
            gpArmLaunchTimeout(asked, 8000);
        });

        gpCloseBtn.addEventListener("click", () => {
            playClickSound();
            gpClose(true);
        });

        /* Tous / Favoris / Récents */
        gpChips.addEventListener("click", event => {
            const b = event.target.closest(".gp-chip");
            if (!b || b.dataset.view === gpView) {
                return;
            }
            gpView = b.dataset.view;
            gpList.scrollTop = 0;
            playClickSound();
            gpRender();
        });

        /* Reprendre le dernier jeu joué (avec sa partie gardée) */
        gpResumeBtn.addEventListener("click", () => {
            if (!gpLibOk() || gpLib.resume < 0 || gpLaunching >= 0 || !gamesCharacteristic) {
                return;
            }
            playClickSound();
            const asked = gpLib.resume;
            const game = gpGames[asked];
            gpSelected = asked;
            gpLaunching = asked;
            gpAsked = { index: asked, time: Date.now() };
            gpFallback = false;
            gpSetMsg("Reprise de « " + (game ? game.label : "?") + " »…");
            gpRender();
            gpQueue([0xFD, 0x0B, gpGen & 0xFF, asked & 0xFF, (asked >> 8) & 0xFF, 0x00]);
            log("REPRENDRE : " + (game ? game.label : asked));
            gpArmLaunchTimeout(asked, 8000);
        });

        gpConsoleBtn.addEventListener("click", () => {
            playClickSound();

            if (Date.now() > gpConsoleArmedUntil) {
                gpConsoleArmedUntil = Date.now() + MENU_CONFIRM_MS;
                gpConsoleBtn.textContent = "🏠 CONFIRMER ?";
                clearTimeout(gpConsoleTimer);
                gpConsoleTimer = setTimeout(gpDisarmConsole, MENU_CONFIRM_MS);
                vibrate(30);
                return;
            }

            gpDisarmConsole();
            gpClose(false);

            /* Ancien MENU JEUX : pendant une partie, la console redémarre
               sur sa liste des jeux ; la page se reconnecte d'elle-même. */
            menuDisconnectDeadline = Date.now() + MENU_DISCONNECT_WINDOW_MS;
            pendingMenuCommand = true;
            processGattQueue();

            statusDiv.textContent = "Retour au menu de la console...";
            log("MENU : retour au menu de la console.");
            vibrate([40, 30, 90]);
        });

        /* =====================================================
           DÉMARRAGE
           ===================================================== */

        window.addEventListener("load", () => {
            log("=== Manette NES BLE prête (page v2.20) ===");
            log(
                "Web Bluetooth : " +
                (navigator.bluetooth ? "disponible" : "absent")
            );
            log(
                "Contexte sécurisé : " +
                (window.isSecureContext ? "HTTPS / OK" : "NON — HTTPS requis")
            );
            log("Envoi BLE régulé à " + SEND_DELAY + " ms.");
        });
    </script>
</body>
</html>
