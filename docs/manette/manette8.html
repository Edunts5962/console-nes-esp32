<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
        user-scalable=no, viewport-fit=cover"
    >

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Manette NES BLE ESP32-S3</title>

    <!-- Page installable (« Ajouter à l'écran d'accueil ») :
         manifeste et icônes à côté de cette page. Sans eux (page ouverte
         seule), rien ne change. -->
    <link rel="manifest" href="manette8.webmanifest">
    <link rel="icon" type="image/png" href="manette8-icon-192.png">
    <link rel="apple-touch-icon" href="manette8-icon-180.png">
    <meta name="theme-color" content="#111111">

    <style>
        :root {
            --coque-haut: #dfded1;
            --coque-bas: #aaa99d;
            --coque-bord: #7f7e73;
            --panneau-haut: #2b2b2b;
            --panneau-bas: #070707;
            --rouge-haut: #f25b55;
            --rouge-bas: #a3070f;
            --rouge-ombre: #5e070b;
            --texte-rouge: #a6272e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #111;
            overflow-x: hidden;
        }

        body {
            min-height: 100dvh;
            padding: 10px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            outline: none;
            cursor: pointer;
        }

        /* =====================================================
           INTERFACE PORTRAIT
           ===================================================== */

        .header {
            width: min(100%, 760px);
            margin: 0 auto 12px;
        }

        h1 {
            margin: 5px 0 10px;
            color: #f2f0db;
            font-size: clamp(18px, 5vw, 26px);
        }

        .scan-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .top-button {
            min-height: 42px;
            padding: 10px 13px;
            border: 2px solid;
            border-radius: 18px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 3px 0 rgba(0, 0, 0, .45);
        }

        .top-button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, .45);
        }

        #scanBtn {
            background: #0067c7;
            border-color: #003d76;
        }

        #connectBtn {
            background: #bd1219;
            border-color: #69090f;
        }

        #orientationBtn {
            background: #5c2696;
            border-color: #341550;
        }

        #quitBtn {
            background: #b53d12;
            border-color: #672007;
        }

        #status {
            min-height: 18px;
            margin: 8px 0 4px;
            color: #ffc638;
            font-size: 13px;
            font-weight: bold;
        }

        #connectionStatus {
            min-height: 17px;
            margin-bottom: 9px;
            color: #a0f8a9;
            font-family: monospace;
            font-size: 12px;
        }

        #speedControl {
            width: min(100%, 420px);
            margin: 0 auto 12px;
            padding: 10px 12px;
            color: #f5e486;
            background: #1b1b1b;
            border: 1px solid #3b3b3b;
            border-radius: 10px;
        }

        #speedControl label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        #speedValue {
            color: white;
            font-family: monospace;
        }

        #speedSlider {
            width: 100%;
            height: 9px;
            appearance: none;
            -webkit-appearance: none;
            border-radius: 10px;
            background: linear-gradient(to right, #1979d5, #f1be2b, #d2151e);
            outline: none;
        }

        #speedSlider::-webkit-slider-thumb {
            width: 23px;
            height: 23px;
            appearance: none;
            -webkit-appearance: none;
            border: 3px solid white;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .7);
        }

        #speedSlider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border: 3px solid white;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .7);
        }

        #dataSent {
            width: min(100%, 760px);
            min-height: 18px;
            margin: 10px auto 0;
            color: #42d9ff;
            font-family: monospace;
            font-size: 11px;
        }

        /* Diagnostic replié */
        #diagBox {
            width: min(100%, 760px);
            margin: 14px auto 0;
            color: #9a9a92;
            font-size: 13px;
        }

        #diagBox > summary {
            cursor: pointer;
            padding: 6px;
            font-weight: bold;
        }

        #diagBox #scanBtn {
            margin-top: 10px;
        }

        #diagHint {
            margin-top: 6px;
            font-size: 11px;
        }

        #speedSlider:disabled {
            opacity: .4;
        }

        #connectBtn.is-connected {
            background: #1b803e;
            border-color: #0f4d24;
        }

        #logConsole {
            width: min(100%, 760px);
            height: 120px;
            margin: 8px auto 0;
            padding: 8px;
            overflow-y: auto;
            color: #24f87a;
            background: black;
            border: 1px solid #343434;
            border-radius: 7px;
            font-family: monospace;
            font-size: 11px;
            text-align: left;
        }

        /* =====================================================
           DESIGN MANETTE NES
           ===================================================== */

        .gamepad {
            position: relative;
            width: min(96vw, 760px);
            height: 320px;
            margin: 0 auto;
            padding: 16px;
            overflow: hidden;
            background: linear-gradient(
                180deg,
                var(--coque-haut) 0%,
                #cbcabd 50%,
                var(--coque-bas) 100%
            );
            border: 5px solid var(--coque-bord);
            border-radius: 11px;
            box-shadow:
                0 10px 0 #56554f,
                0 19px 28px rgba(0, 0, 0, .58),
                inset 0 2px 0 rgba(255, 255, 255, .64),
                inset 0 -5px 0 rgba(0, 0, 0, .12);
        }

        .gamepad::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 24%;
            background: linear-gradient(180deg, rgba(255,255,255,.16), transparent);
            pointer-events: none;
        }

        .nes-face {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(
                154deg,
                var(--panneau-haut) 0%,
                #121212 57%,
                var(--panneau-bas) 100%
            );
            border: 3px solid #070707;
            border-radius: 3px;
            box-shadow:
                inset 0 0 0 2px #77766c,
                inset 0 0 22px rgba(0, 0, 0, .85);
        }

        .nes-face::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(
                180deg,
                rgba(231,231,216,.95),
                rgba(170,169,158,.99)
            );
            border-top: 2px solid #85847b;
            pointer-events: none;
        }

        .nes-title {
            position: absolute;
            top: 13%;
            right: 7%;
            z-index: 3;
            color: var(--texte-rouge);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(13px, 3vw, 29px);
            font-style: italic;
            font-weight: 900;
            letter-spacing: -.6px;
            text-shadow: 1px 1px 0 #260508;
        }

        .nes-subtitle {
            position: absolute;
            top: 29%;
            right: 8%;
            z-index: 3;
            color: #a9a9a9;
            font-size: clamp(7px, 1.4vw, 12px);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* =====================================================
           CROIX DIRECTIONNELLE
           ===================================================== */

        .dpad-area {
            position: absolute;
            top: 17%;
            left: 6%;
            z-index: 5;
            width: 30%;
            height: 54%;
        }

        /* Croix d'un seul tenant, comme sur la manette NES
           d'origine. Toute la zone est tactile : on fait glisser le pouce
           d'une direction à l'autre sans le lever, et on obtient une
           diagonale en appuyant entre deux branches (plus de boutons
           diagonaux séparés). La croix bascule légèrement du côté appuyé. */
        .dpad-area {
            touch-action: none;
        }

        .dpad-area::after {
            /* zone tactile un peu plus large que la croix */
            content: "";
            position: absolute;
            inset: -7%;
        }

        .dpad-cross {
            position: absolute;
            inset: 0;
            z-index: 3;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            filter: drop-shadow(0 5px 3px rgba(0,0,0,.6));
            transform: perspective(420px) rotateX(var(--dpad-tx, 0deg)) rotateY(var(--dpad-ty, 0deg));
            transition: transform 45ms linear;
        }

        .dpad-cross .dpad-arm {
            opacity: 0;
            transition: opacity 45ms linear;
        }

        .dpad-cross.d-up .dpad-arm-up,
        .dpad-cross.d-down .dpad-arm-down,
        .dpad-cross.d-left .dpad-arm-left,
        .dpad-cross.d-right .dpad-arm-right {
            opacity: 1;
        }

        /* =====================================================
           SELECT / START
           ===================================================== */

        .nes-middle-controls {
            position: absolute;
            bottom: 8%;
            left: 37%;
            z-index: 5;
            display: flex;
            width: 26%;
            gap: 8%;
        }

        .nes-small-button {
            position: relative;
            width: 46%;
            height: clamp(28px, 7vw, 42px);
            padding: 0;
            border: 3px solid #b8b7a8;
            border-radius: 5px;
            background: linear-gradient(145deg, #707069, #2d2d2a);
            box-shadow:
                inset 2px 2px 0 rgba(255,255,255,.35),
                inset -2px -2px 0 #111,
                0 3px 0 #050505;
        }

        .nes-small-button span {
            position: absolute;
            top: calc(100% + 4px);
            left: 50%;
            color: #8d252d;
            font-size: clamp(7px, 1.6vw, 12px);
            font-weight: 900;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .nes-small-button:active,
        .nes-small-button.pressed {
            transform: translateY(3px);
            background: linear-gradient(145deg, #353532, #151514);
            box-shadow:
                inset 2px 2px 5px #000,
                0 0 0 #050505;
        }

        /* =====================================================
           BOUTONS A / B
           ===================================================== */

        .nes-action-buttons {
            position: absolute;
            right: 7%;
            bottom: 10%;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 14%;
        }

        .nes-round-button {
            width: clamp(50px, 12vw, 84px);
            aspect-ratio: 1;
            padding: 0;
            border: 3px solid #610c10;
            border-radius: 50%;
            color: #50090d;
            background: linear-gradient(145deg, var(--rouge-haut), var(--rouge-bas));
            box-shadow:
                inset 3px 3px 5px rgba(255,255,255,.42),
                inset -4px -4px 7px rgba(63,0,0,.5),
                0 6px 0 var(--rouge-ombre),
                0 8px 10px rgba(0,0,0,.52);
            font-size: clamp(15px, 3vw, 28px);
            font-weight: 900;
            text-shadow: 1px 1px 0 rgba(255,255,255,.18);
        }

        .nes-round-button:active,
        .nes-round-button.pressed {
            transform: translateY(6px);
            background: linear-gradient(145deg, #c51319, #79040a);
            box-shadow:
                inset 3px 3px 8px rgba(60,0,0,.7),
                0 0 0 var(--rouge-ombre);
        }

        .button-b {
            transform: translateY(10px);
        }

        .button-b:active,
        .button-b.pressed {
            transform: translateY(16px);
        }

        /* =====================================================
           BOUTONS FLOTTANTS PAYSAGE
           ===================================================== */

        .floating-controls {
            display: none;
            position: fixed;
            top: max(8px, env(safe-area-inset-top));
            right: max(8px, env(safe-area-inset-right));
            z-index: 30;
            flex-direction: column;
            gap: 7px;
        }

        .floating-controls button {
            padding: 9px 13px;
            border: 2px solid;
            border-radius: 18px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 3px 9px rgba(0,0,0,.55);
        }

        #backBtn {
            border-color: #2c1550;
            background: rgba(90, 37, 150, .94);
        }

        #quitBtnFloat {
            border-color: #6d2005;
            background: rgba(183, 59, 15, .95);
        }

        /* =====================================================
           MODE PAYSAGE
           ===================================================== */

        body.landscape {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100dvh;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #242424 0%, #070707 76%);
        }

        body.landscape .header,
        body.landscape #diagBox,
        body.landscape #dataSent,
        body.landscape #logConsole {
            display: none !important;
        }

        body.landscape .floating-controls {
            display: flex;
        }

        body.landscape .gamepad {
            width: 96vw;
            height: 92dvh;
            max-width: 1200px;
            margin: 0;
            padding: 2.5vh 2vw;
            border-width: 6px;
            border-radius: 15px;
        }

        body.landscape .nes-title {
            top: 11%;
            right: 7%;
            font-size: clamp(21px, 3.2vw, 42px);
        }

        body.landscape .nes-subtitle {
            top: 27%;
            right: 8%;
            font-size: clamp(8px, 1.3vw, 15px);
        }

        body.landscape .dpad-area {
            top: 16%;
            left: 6%;
            width: 28%;
            height: 62%;
        }

        body.landscape .nes-action-buttons {
            top: 30%;
            right: 8%;
            bottom: auto;
            gap: 18%;
        }

        body.landscape .nes-round-button {
            width: clamp(85px, 12vw, 150px);
            font-size: clamp(28px, 4vw, 46px);
        }

        body.landscape .button-b {
            transform: translateY(18px);
        }

        body.landscape .button-b:active,
        body.landscape .button-b.pressed {
            transform: translateY(24px);
        }

        body.landscape .nes-middle-controls {
            right: 6%;
            bottom: 8%;
            left: auto;
            width: clamp(210px, 31vw, 410px);
            gap: 7%;
        }

        body.landscape .nes-small-button {
            height: clamp(40px, 7vh, 62px);
        }

        body.landscape .nes-small-button span {
            font-size: clamp(10px, 1.8vw, 17px);
        }

        @media (max-width: 470px) and (orientation: portrait) {
            .gamepad {
                height: 270px;
            }

            .dpad-area {
                left: 5%;
                width: 34%;
            }

            .nes-middle-controls {
                left: 39%;
                width: 24%;
            }

            .nes-action-buttons {
                right: 5%;
                gap: 8%;
            }
        }

        /* Croix directionnelle plus grande (ergonomie). Seule la zone de la croix change :
           A, B, SELECT, START et le titre restent à leur place. */
        .dpad-area {
            top: 9%;
            left: 4%;
            width: 34%;
            height: 76%;
        }

        body.landscape .dpad-area {
            top: 7%;
            left: 3.5%;
            width: 37%;
            height: 86%;
        }

        @media (max-width: 470px) and (orientation: portrait) {
            .dpad-area {
                top: 6%;
                left: 3%;
                width: 46%;
                height: 73%;
            }
        }
    </style>

         Feuille a part : la feuille de style d'origine de la manette n'est
         pas modifiee, aucun bouton ne bouge. -->
    <style id="gamesPanelStyle">
        .gp-overlay {

            display: flex;
            align-items: center;

                     max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            background: rgba(0, 0, 0, .72);
        }

        .gp-overlay[hidden] {
            display: none !important;
        }

            background: linear-gradient(180deg, var(--coque-haut), var(--coque-bas));
            box-shadow: 0 18px 40px rgba(0, 0, 0, .6);

        }

        /* Pendant une recherche, le panneau garde toute sa hauteur

            height: 100%;
        }

        .gp-title {

        /* Recherche (16 px : pas de zoom automatique du navigateur) */

        }

        .gp-search::placeholder {

        .gp-search:focus {

        }

        .gp-row + .gp-row {

        .gp-row[aria-selected="true"] {

        .gp-name {

        /* Listes Tous / Favoris / Récents, Reprendre, étoiles */

        .gp-empty {

        }

        .gp-msg {
            min-height: 18px;
            font-size: 13px;
            font-weight: bold;
            color: #3c3b36;
        }

        .gp-msg.gp-err {

        }

        .gp-actions {
            display: flex;
            gap: 10px;
        }

        .gp-btn {
            min-height: 48px;
            padding: 0 14px;
            border: 2px solid #111;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, .45);

    <!-- Panneau des jeux de la console, ouvert par MENU JEUX

    <script>
        "use strict";

        /* =====================================================
           UUIDS : doivent être identiques à l'ESP32
           ===================================================== */

        const NES_SERVICE_UUID = "0000fff0-0000-1000-8000-00805f9b34fb";
        const NES_CHAR_UUID = "0000fff1-0000-1000-8000-00805f9b34fb";
        /* Réponses de la console (liste des jeux), en notifications. */
        const NES_GAMES_CHAR_UUID = "0000fff2-0000-1000-8000-00805f9b34fb";

        /*
         * Commandes NES :
         * A       = 0x01
         * B       = 0x02
         * SELECT  = 0x04
         * START   = 0x08
         * UP      = 0x10
         * DOWN    = 0x20
         * LEFT    = 0x40
         * RIGHT   = 0x80
         *
         * Réglage vitesse : [0xFE, vitesse]  (ignoré par l'émulateur NES)
         * Retour au menu des jeux : [0xFD, 0x01, 0x00]
         * Contrôle de liaison : [0xFD, 0x02, 0x00], écrit AVEC accusé de
         * réception, ignoré par la console
         */

        const NES_MENU_FRAME = [0xFD, 0x01, 0x00];
        const NES_PING_FRAME = [0xFD, 0x02, 0x00];
        /*
         * Liste des jeux et changement de jeu sans
         * redémarrer la console :
         *   [0xFD, 0x03, 0x00]                 LISTE
         *   [0xFD, 0x04, gén, n° bas, n° haut, 0x00]   LANCER
         *   [0xFD, 0x05, 1 | 0, 0x00]          PAUSE / REPRISE
         * Toutes écrites AVEC accusé de réception.
         */
        const NES_LIST_FRAME = [0xFD, 0x03, 0x00];
        /*
         * Liste COMPLÈTE de la console
         * (jusqu'à 1000 jeux, pas seulement la page de 50 affichée) :
         *   [0xFD, 0x07, 0x00]                          LISTE COMPLÈTE
         *   [0xFD, 0x07, gén, crc bas, crc haut, 0x00]  idem, en donnant la
         *        liste déjà reçue (la console ne la renvoie pas si rien n'a changé)
         *   [0xFD, 0x08, gén, n° bas, n° haut, 0x00]    LANCER (n° de la liste complète)
         */
        const NES_LIST_ALL_FRAME = [0xFD, 0x07, 0x00];
        /*
         * *   [0xFD, 0x09, gén, n° bas, n° haut, 0x00]   FAVORI (ajoute ou retire)
         *   [0xFD, 0x0A, volume 0..200, 0x00]          VOLUME de la console
         *   [0xFD, 0x0B, gén, n° bas, n° haut, 0x00]   REPRENDRE ce jeu (partie gardée)
         * La console envoie en retour sa bibliothèque (message 0x09 :
         * favoris, récents, jeu à reprendre) et son volume (ÉTAT, octet 12).
         */

        const scanBtn = document.getElementById("scanBtn");
        const connectBtn = document.getElementById("connectBtn");
        const orientationBtn = document.getElementById("orientationBtn");
        const quitBtn = document.getElementById("quitBtn");
        const quitBtnFloat = document.getElementById("quitBtnFloat");
        const backBtn = document.getElementById("backBtn");

        const speedSlider = document.getElementById("speedSlider");
        const speedValue = document.getElementById("speedValue");

        const statusDiv = document.getElementById("status");
        const connectionStatus = document.getElementById("connectionStatus");
        const dataSent = document.getElementById("dataSent");
        const logConsole = document.getElementById("logConsole");

        let connectedDevice = null;
        let gattServer = null;
        let nesService = null;
        let nesCharacteristic = null;

        let buttonUp = false;
        let buttonDown = false;
        let buttonLeft = false;
        let buttonRight = false;

        let buttonUpLeft = false;
        let buttonUpRight = false;
        let buttonDownLeft = false;
        let buttonDownRight = false;

        let buttonA = false;
        let buttonB = false;
        let buttonSelect = false;
        let buttonStart = false;

        let currentSpeed = 5;
        let isLandscapeMode = false;
        let audioContext = null;

        /*
         * 100 ms = 10 fois par seconde (renvoi des touches tenues).
         * Cette fréquence est stable sur Android / Chrome et limite
         * le risque de surcharge GATT.
         */
        const SEND_DELAY = 100;
        let sendInterval = null;

        /*
         * File d'attente spéciale pour BLE :
         * - une seule écriture GATT à la fois ;
         * - si plusieurs commandes arrivent vite, seule la plus récente
         *   est conservée. C'est idéal pour un état de manette.
         */
        let gattWriteInProgress = false;
        let pendingGameCommand = null;
        let pendingSpeedCommand = null;
        let pendingMenuCommand = false;  
        let pendingPing = false;         /* Contrôle de liaison */
        let pendingSystemFrames = [];    /* Liste, lancer, pause (dans l'ordre) */
        let gamesCharacteristic = null;  /* FFF2, null avec un programme plus ancien */
        let pingInFlight = false;
        let lastQueuedGameCommand = null;
        let lastSentGameCommand = null;
        let writeFailureCount = 0;

        /* =====================================================
           OUTILS
           ===================================================== */

        function log(message) {
            const line = document.createElement("div");
            line.textContent = "> " + message;
            logConsole.appendChild(line);
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        function vibrate(pattern = 20) {
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function prepareAudio() {
            if (audioContext) {
                if (audioContext.state === "suspended") {
                    audioContext.resume().catch(() => {});
                }
                return;
            }

            try {
                audioContext = new (
                    window.AudioContext || window.webkitAudioContext
                )();
            } catch (error) {
                log("Son non disponible.");
            }
        }

        function playClickSound() {
            prepareAudio();

            if (!audioContext) {
                return;
            }

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.type = "square";
            oscillator.frequency.setValueAtTime(680, audioContext.currentTime);

            gain.gain.setValueAtTime(0.12, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.01,
                audioContext.currentTime + 0.035
            );

            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.04);
        }

        function bluetoothAvailable() {
            if (!navigator.bluetooth) {
                statusDiv.textContent = "Web Bluetooth non disponible";
                log("ERREUR : Web Bluetooth absent.");
                return false;
            }

            if (!window.isSecureContext) {
                statusDiv.textContent = "HTTPS requis pour Web Bluetooth";
                log("ERREUR : utilisez HTTPS ou localhost.");
                return false;
            }

            return true;
        }

        /* =====================================================
           ÉTAT DES TOUCHES
           ===================================================== */

        function getNesByte() {
            let byte = 0;

            if (buttonUpLeft) {
                byte |= 0b01010000;
            }

            if (buttonUpRight) {
                byte |= 0b10010000;
            }

            if (buttonDownLeft) {
                byte |= 0b01100000;
            }

            if (buttonDownRight) {
                byte |= 0b10100000;
            }

            if (!buttonUpLeft && !buttonUpRight && buttonUp) {
                byte |= 0b00010000;
            }

            if (!buttonDownLeft && !buttonDownRight && buttonDown) {
                byte |= 0b00100000;
            }

            if (!buttonUpLeft && !buttonDownLeft && buttonLeft) {
                byte |= 0b01000000;
            }

            if (!buttonUpRight && !buttonDownRight && buttonRight) {
                byte |= 0b10000000;
            }

            if (buttonA) {
                byte |= 0b00000001;
            }

            if (buttonB) {
                byte |= 0b00000010;
            }

            if (buttonSelect) {
                byte |= 0b00000100;
            }

            if (buttonStart) {
                byte |= 0b00001000;
            }

            return byte;
        }

        function hasPressedButton() {
            return getNesByte() !== 0;
        }

        function setButtonState(key, pressed) {
            switch (key) {
                case "UP":
                    buttonUp = pressed;
                    break;

                case "DOWN":
                    buttonDown = pressed;
                    break;

                case "LEFT":
                    buttonLeft = pressed;
                    break;

                case "RIGHT":
                    buttonRight = pressed;
                    break;

                case "UP-LEFT":
                    buttonUpLeft = pressed;
                    break;

                case "UP-RIGHT":
                    buttonUpRight = pressed;
                    break;

                case "DOWN-LEFT":
                    buttonDownLeft = pressed;
                    break;

                case "DOWN-RIGHT":
                    buttonDownRight = pressed;
                    break;

                case "A":
                    buttonA = pressed;
                    break;

                case "B":
                    buttonB = pressed;
                    break;

                case "SELECT":
                    buttonSelect = pressed;
                    break;

                case "START":
                    buttonStart = pressed;
                    break;
            }
        }

        function updateCommandDisplay(commandByte) {
            const binary = commandByte.toString(2).padStart(8, "0");
            const hex = commandByte.toString(16).toUpperCase().padStart(2, "0");

            dataSent.textContent =
                `Dernière commande : 0x${hex} (${binary})`;
        }

        /* =====================================================
           FILE D'ÉCRITURE GATT : CORRECTION ERREUR
           "GATT operation already in progress"
           ===================================================== */

        function clearGattQueue() {
            pendingGameCommand = null;
            pendingSpeedCommand = null;
            pendingMenuCommand = false;
            pendingSystemFrames = [];   
            pendingPing = false;
            pingInFlight = false;
            lastQueuedGameCommand = null;
            lastSentGameCommand = null;
            gattWriteInProgress = false;
            writeFailureCount = 0;
        }

        async function performGattWrite(data, withResponse = false) {
            if (
                !nesCharacteristic ||
                !connectedDevice ||
                !connectedDevice.gatt ||
                !connectedDevice.gatt.connected
            ) {
                return false;
            }

            /*
             * Le contrôle de liaison attend l'accusé de
             * réception de l'ESP32 (preuve que la liaison fonctionne).
             */
            if (withResponse) {
                if (typeof nesCharacteristic.writeValueWithResponse === "function") {
                    await nesCharacteristic.writeValueWithResponse(data);
                } else {
                    await nesCharacteristic.writeValue(data);
                }
                return true;
            }

            /*
             * Sur certains navigateurs, writeValueWithoutResponse est
             * disponible et plus approprié pour une manette.
             * Sinon writeValue est utilisé.
             */
            if (
                typeof nesCharacteristic.writeValueWithoutResponse ===
                "function"
            ) {
                await nesCharacteristic.writeValueWithoutResponse(data);
            } else {
                await nesCharacteristic.writeValue(data);
            }

            return true;
        }

        function processGattQueue() {
            if (gattWriteInProgress) {
                return;
            }

            if (
                !nesCharacteristic ||
                !connectedDevice ||
                !connectedDevice.gatt ||
                !connectedDevice.gatt.connected
            ) {
                return;
            }

            let dataToSend = null;
            let type = "";

            /*
             * La commande MENU passe en premier.
             * Priorité ensuite à la vitesse : elle doit être livrée une fois.
             */
            if (pendingMenuCommand) {
                dataToSend = new Uint8Array(NES_MENU_FRAME);
                pendingMenuCommand = false;
                type = "menu";
            } else if (pendingSystemFrames.length) {
                /* Liste des jeux, lancer, pause. */
                dataToSend = new Uint8Array(pendingSystemFrames.shift());
                type = "system";
            } else if (pendingSpeedCommand !== null) {
                dataToSend = new Uint8Array([0xFE, pendingSpeedCommand]);
                pendingSpeedCommand = null;
                type = "speed";
            } else if (pendingGameCommand !== null) {
                dataToSend = new Uint8Array([pendingGameCommand]);
                lastSentGameCommand = pendingGameCommand;
                pendingGameCommand = null;
                type = "game";
            } else if (pendingPing) {
                /* Contrôle de liaison, en dernier. */
                dataToSend = new Uint8Array(NES_PING_FRAME);
                pendingPing = false;
                pingInFlight = true;
                type = "ping";
            } else {
                return;
            }

            gattWriteInProgress = true;

            performGattWrite(dataToSend, type === "ping" || type === "system")
                .then(() => {
                    writeFailureCount = 0;

                    if (type === "speed") {
                        log("Vitesse confirmée par BLE : " + dataToSend[1]);
                    }

                    if (type === "menu") {
                        log("Commande MENU transmise à la console.");
                    }

                    if (type === "ping") {
                        lastPingAck = Date.now();
                    }
                })
                .catch(error => {
                    writeFailureCount++;

                    /*
                     * Ne pas saturer le journal avec le même message.
                     * Le code réessaie avec la dernière commande disponible.
                     */
                    if (writeFailureCount <= 2) {
                        log(
                            "Écriture BLE reportée : " +
                            error.name +
                            " — " +
                            error.message
                        );
                    }

                    if (type === "game") {
                        pendingGameCommand = dataToSend[0];
                    }

                    if (type === "speed") {
                        pendingSpeedCommand = dataToSend[1];
                    }

                    if (type === "menu") {
                        pendingMenuCommand = true;
                    }

                    if (type === "system") {
                        pendingSystemFrames.unshift(Array.from(dataToSend));
                    }
                })
                .finally(() => {
                    gattWriteInProgress = false;

                    if (type === "ping") {
                        pingInFlight = false;
                    }

                    /*
                     * Petite temporisation entre deux transactions GATT.
                     * Elle évite de relancer une opération pendant que le
                     * système Android libère encore la précédente.
                     */
                    setTimeout(processGattQueue, 8);
                });
        }

        function queueGameCommand(commandByte) {
            /*
             * Les commandes identiques ne sont pas empilées :
             * on ne conserve que le dernier état connu.
             */
            if (
                commandByte === lastQueuedGameCommand &&
                pendingGameCommand === null
            ) {
                return;
            }

            lastQueuedGameCommand = commandByte;
            pendingGameCommand = commandByte;

            processGattQueue();
        }

        function queueSpeedCommand(speed) {
            pendingSpeedCommand = speed;
            processGattQueue();
        }

        function sendNesCommand(commandByte) {
            /*
             * L'affichage se met toujours à jour, connecté ou non.
             */
            updateCommandDisplay(commandByte);

            /*
             * L'envoi BLE est mis en file, jamais lancé en parallèle.
             */
            queueGameCommand(commandByte);
        }

        function sendSpeedCommand(speed) {
            if (!nesCharacteristic) {
                log("Vitesse mémorisée : " + speed + " (ESP32 non connecté).");
                return;
            }

            queueSpeedCommand(speed);
        }

        /* =====================================================
           ENVOI CONTINU DES TOUCHES MAINTENUES
           ===================================================== */

        function startSending() {
            if (sendInterval) {
                return;
            }

            sendNesCommand(getNesByte());

            sendInterval = setInterval(() => {
                const command = getNesByte();

                if (command === 0) {
                    stopSending();
                    return;
                }

                /*
                 * Renvoie l'état des touches tenues à
                 * chaque tour. Sans cette ligne, queueGameCommand()
                 * écartait cet état identique et la console relâchait la
                 * touche au bout de son délai de sécurité.
                 */
                lastQueuedGameCommand = null;
                sendNesCommand(command);
            }, SEND_DELAY);
        }

        function stopSending() {
            if (!sendInterval) {
                return;
            }

            clearInterval(sendInterval);
            sendInterval = null;
        }

        /* =====================================================
           CONNEXION BLE / GATT
           ===================================================== */

        function resetConnection() {
            stopSending();
            clearGattQueue();

            connectedDevice = null;
            gattServer = null;
            nesService = null;
            nesCharacteristic = null;
            gamesCharacteristic = null;   
            gpOnLinkDown();

            connectionStatus.textContent = "Connexion : non connectée";
            connectionStatus.style.color = "#ff8c8c";
        }

        function onDisconnected() {
            log("ESP32 déconnecté.");
            statusDiv.textContent = "Déconnecté";
            resetConnection();
        }

        async function connectToDevice(device) {
            try {
                const name = device.name || "Périphérique sans nom";

                statusDiv.textContent = "Connexion à " + name + "...";
                connectionStatus.textContent = "Connexion : GATT en cours...";
                connectionStatus.style.color = "#ffd75e";

                log("Connexion GATT à : " + name);

                gattServer = await device.gatt.connect();
                connectedDevice = device;

                log("Recherche service NES FFF0...");
                nesService = await gattServer.getPrimaryService(
                    NES_SERVICE_UUID
                );

                log("Recherche caractéristique NES FFF1...");
                nesCharacteristic = await nesService.getCharacteristic(
                    NES_CHAR_UUID
                );

                clearGattQueue();

                device.addEventListener(
                    "gattserverdisconnected",
                    onDisconnected,
                    { once: true }
                );

                /* Liste des jeux, si la console la propose
                   (après l'écoute de la déconnexion : une liaison perdue
                   pendant l'abonnement fait échouer la connexion). */
                await setupGamesCharacteristic(device);

                statusDiv.textContent = "Connecté : " + name;
                connectionStatus.textContent = "Connexion : ✅ ESP32 CONNECTÉ";
                connectionStatus.style.color = "#91ff9f";

                log("Connexion réussie : commandes prêtes.");

                vibrate([35, 25, 35]);

                /*
                 * Après connexion, envoie l'état courant de la manette
                 *.
                 */
                sendNesCommand(getNesByte());

                onLinkUp(device);  /* Voyant de liaison */

            } catch (error) {
                log(
                    "Erreur connexion GATT : " +
                    error.name +
                    " — " +
                    error.message
                );

                statusDiv.textContent = "Échec de connexion";
                connectionStatus.textContent = "Connexion : ❌ ÉCHEC";
                connectionStatus.style.color = "#ff8c8c";

                resetConnection();
            }
        }

        /* =====================================================
           SCAN BLE : SANS FILTRE DE NOM
           ===================================================== */

        async function scanAllBLE() {
            if (!bluetoothAvailable()) {
                return;
            }

            try {
                log("Ouverture du sélecteur Bluetooth...");
                statusDiv.textContent = "Recherche BLE...";
                connectionStatus.textContent =
                    "Connexion : choix du périphérique...";
                connectionStatus.style.color = "#ffd75e";

                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        NES_SERVICE_UUID,
                        "battery_service",
                        "device_information"
                    ]
                });

                log(
                    "Périphérique choisi : " +
                    (device.name || "Sans nom")
                );

                await connectToDevice(device);

            } catch (error) {
                log(
                    "Scan BLE : " +
                    error.name +
                    " — " +
                    error.message
                );

                if (error.name === "NotFoundError") {
                    statusDiv.textContent = "Sélection annulée";
                } else {
                    statusDiv.textContent = "Scan BLE impossible";
                }

                connectionStatus.textContent = "Connexion : ❌ ÉCHEC";
                connectionStatus.style.color = "#ff8c8c";
            }
        }

        async function scanESP32() {
            if (!bluetoothAvailable()) {
                return;
            }

            try {
                log("Choisissez la console NES dans la liste...");
                statusDiv.textContent = "Choisissez la console...";
                connectionStatus.textContent =
                    "Connexion : attente sélection...";
                connectionStatus.style.color = "#ffd75e";

                /*
                 * Seules les consoles NES (service FFF0 annoncé par
                 * la console) sont proposées. Si elle n'apparaît pas :
                 * Diagnostic > SCAN BLE (tous les appareils).
                 */
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [NES_SERVICE_UUID] }],
                    optionalServices: [
                        "battery_service",
                        "device_information"
                    ]
                });

                log(
                    "Sélectionné : " +
                    (device.name || "Sans nom") +
                    " | ID : " +
                    device.id
                );

                await connectToDevice(device);

            } catch (error) {
                log(
                    "Scan ESP32 : " +
                    error.name +
                    " — " +
                    error.message
                );

                if (error.name === "NotFoundError") {
                    statusDiv.textContent = "Sélection annulée";
                } else if (error.name === "SecurityError") {
                    statusDiv.textContent =
                        "HTTPS ou permission Bluetooth requis";
                } else {
                    statusDiv.textContent = "Scan / connexion impossible";
                }

                connectionStatus.textContent = "Connexion : ❌ ÉCHEC";
                connectionStatus.style.color = "#ff8c8c";
            }
        }

        /* =====================================================
           GESTION DES BOUTONS
           ===================================================== */

        const controllerButtons = document.querySelectorAll(
            ".nes-round-button, .nes-small-button"
        );

        function pressControllerButton(button, event) {
            event.preventDefault();

            const key = button.dataset.key;

            if (!key) {
                return;
            }

            prepareAudio();

            button.classList.add("pressed");
            setButtonState(key, true);

            sendNesCommand(getNesByte());
            startSending();

            vibrate(22);
            playClickSound();
        }

        function releaseControllerButton(button, event) {
            event.preventDefault();

            const key = button.dataset.key;

            if (!key) {
                return;
            }

            button.classList.remove("pressed");
            setButtonState(key, false);

            sendNesCommand(getNesByte());

            if (!hasPressedButton()) {
                stopSending();
            }
        }

        controllerButtons.forEach(button => {
            button.addEventListener("pointerdown", event => {
                button.setPointerCapture?.(event.pointerId);
                pressControllerButton(button, event);
            });

            button.addEventListener("pointerup", event => {
                releaseControllerButton(button, event);
            });

            button.addEventListener("pointercancel", event => {
                releaseControllerButton(button, event);
            });

            button.addEventListener("lostpointercapture", event => {
                const key = button.dataset.key;

                if (!key) {
                    return;
                }

                button.classList.remove("pressed");
                setButtonState(key, false);

                sendNesCommand(getNesByte());

                if (!hasPressedButton()) {
                    stopSending();
                }
            });
        });

        /* =====================================================
           CROIX DIRECTIONNELLE GLISSANTE
           - Toute la zone de la croix est tactile ; la direction suit
             l'angle du pouce par rapport au centre : on glisse d'une
             direction à l'autre sans lever le doigt.
           - Diagonale : entre deux branches (secteur de 34° autour de
             45°), plus étroit que les directions droites pour éviter les
             diagonales involontaires (s'accroupir en avançant...).
           - Centre (petit cercle) : aucune direction, comme le creux de
             la vraie croix. Le doigt peut sortir de la croix : la
             direction reste suivie jusqu'au lever du doigt.
           - Un seul doigt à la fois sur la croix ; A, B, SELECT et START
             restent utilisables en même temps.
           ===================================================== */

        const dpadArea = document.getElementById("dpadArea");
        const dpadCross = document.getElementById("dpadCross");
        const DPAD_UP = 1, DPAD_DOWN = 2, DPAD_LEFT = 4, DPAD_RIGHT = 8;
        const DPAD_DEAD_ZONE = 0.2;      /* rayon du centre neutre (fraction du demi-côté) */
        const DPAD_DIAGONAL_HALF = 17;   /* demi-largeur du secteur diagonal, en degrés */
        const DPAD_HYSTERESIS = 6;       /* degrés à franchir pour changer de secteur */
        const DPAD_TILT = 7;             /* bascule de la croix, en degrés */
        let dpadPointer = null;
        let dpadMask = 0;

        function dpadMaskFromPoint(x, y) {
            const r = dpadArea.getBoundingClientRect();
            const half = Math.min(r.width, r.height) / 2;
            const dx = (x - (r.left + r.width / 2)) / half;
            const dy = (y - (r.top + r.height / 2)) / half;
            const dist = Math.hypot(dx, dy);

            /* Centre neutre, un peu plus petit pour en sortir que pour y entrer. */
            if (dist < (dpadMask ? DPAD_DEAD_ZONE * 0.75 : DPAD_DEAD_ZONE)) {
                return 0;
            }

            let angle = Math.atan2(-dy, dx) * 180 / Math.PI;   /* 0 = droite, 90 = haut */
            if (angle < 0) {
                angle += 360;
            }

            const diagonals = [
                [45, DPAD_UP | DPAD_RIGHT],
                [135, DPAD_UP | DPAD_LEFT],
                [225, DPAD_DOWN | DPAD_LEFT],
                [315, DPAD_DOWN | DPAD_RIGHT]
            ];

            for (const [center, mask] of diagonals) {
                const delta = Math.abs(((angle - center + 540) % 360) - 180);
                const limit = dpadMask === mask
                    ? DPAD_DIAGONAL_HALF + DPAD_HYSTERESIS
                    : DPAD_DIAGONAL_HALF - (dpadMask ? DPAD_HYSTERESIS : 0);
                if (delta <= limit) {
                    return mask;
                }
            }

            /* Direction droite la plus proche. */
            if (angle >= 315 || angle < 45) return DPAD_RIGHT;
            if (angle < 135) return DPAD_UP;
            if (angle < 225) return DPAD_LEFT;
            return DPAD_DOWN;
        }

        function dpadRender() {
            dpadCross.classList.toggle("d-up", Boolean(dpadMask & DPAD_UP));
            dpadCross.classList.toggle("d-down", Boolean(dpadMask & DPAD_DOWN));
            dpadCross.classList.toggle("d-left", Boolean(dpadMask & DPAD_LEFT));
            dpadCross.classList.toggle("d-right", Boolean(dpadMask & DPAD_RIGHT));

            const tx = (dpadMask & DPAD_UP ? DPAD_TILT : 0) - (dpadMask & DPAD_DOWN ? DPAD_TILT : 0);
            const ty = (dpadMask & DPAD_RIGHT ? DPAD_TILT : 0) - (dpadMask & DPAD_LEFT ? DPAD_TILT : 0);
            dpadCross.style.setProperty("--dpad-tx", tx + "deg");
            dpadCross.style.setProperty("--dpad-ty", ty + "deg");
        }

        function dpadSet(mask) {
            if (mask === dpadMask) {
                return;
            }

            const wasPressed = dpadMask !== 0;
            dpadMask = mask;

            buttonUp = Boolean(mask & DPAD_UP);
            buttonDown = Boolean(mask & DPAD_DOWN);
            buttonLeft = Boolean(mask & DPAD_LEFT);
            buttonRight = Boolean(mask & DPAD_RIGHT);
            buttonUpLeft = false;
            buttonUpRight = false;
            buttonDownLeft = false;
            buttonDownRight = false;

            dpadRender();
            sendNesCommand(getNesByte());

            if (hasPressedButton()) {
                startSending();
            } else {
                stopSending();
            }

            if (mask && !wasPressed) {
                vibrate(22);
                playClickSound();
            } else if (mask) {
                vibrate(9);   /* passage d'une direction à l'autre */
            }
        }

        function dpadEnd(event) {
            if (event.pointerId !== dpadPointer) {
                return;
            }
            dpadPointer = null;
            dpadSet(0);
        }

        function dpadReset() {
            dpadPointer = null;
            dpadMask = 0;
            dpadRender();
        }

        dpadArea.addEventListener("pointerdown", event => {
            if (dpadPointer !== null) {
                return;
            }
            event.preventDefault();
            prepareAudio();
            dpadPointer = event.pointerId;
            dpadArea.setPointerCapture?.(event.pointerId);
            dpadSet(dpadMaskFromPoint(event.clientX, event.clientY));
        });

        dpadArea.addEventListener("pointermove", event => {
            if (event.pointerId !== dpadPointer) {
                return;
            }
            event.preventDefault();
            dpadSet(dpadMaskFromPoint(event.clientX, event.clientY));
        });

        dpadArea.addEventListener("pointerup", dpadEnd);
        dpadArea.addEventListener("pointercancel", dpadEnd);
        dpadArea.addEventListener("lostpointercapture", dpadEnd);
        dpadArea.addEventListener("contextmenu", event => event.preventDefault());

        /* =====================================================
           VITESSE
           ===================================================== */

        /* VOLUME DE LA CONSOLE. Envoyé pendant le glissement (au
           plus 4 fois par seconde) et au relâchement ; la valeur affichée
           suit ensuite celle de la console (ÉTAT), sauf pendant un réglage. */
        let volumeTouchedAt = 0;
        let volumeSentAt = 0;
        let volumeTimer = null;

        function sendVolume() {
            clearTimeout(volumeTimer);
            volumeTimer = null;
            if (!gamesCharacteristic) {
                return;
            }
            volumeSentAt = Date.now();
            const v = Number(speedSlider.value);
            gpQueue([0xFD, 0x0A, v & 0xFF, 0x00]);
        }

        speedSlider.addEventListener("input", () => {
            volumeTouchedAt = Date.now();
            speedValue.textContent = speedSlider.value + " %";
            if (Date.now() - volumeSentAt >= 250) {
                sendVolume();
            } else if (!volumeTimer) {
                volumeTimer = setTimeout(sendVolume, 250);
            }
        });
        speedSlider.addEventListener("change", () => {
            volumeTouchedAt = Date.now();
            sendVolume();
            vibrate(12);
            log("Volume de la console : " + speedSlider.value + " %");
        });

        /* Volume annoncé par la console (ÉTAT de 13 octets) ; null : console
           plus ancienne, sans réglage à distance. */
        function showConsoleVolume(v) {
            if (v === null) {
                speedSlider.disabled = true;
                speedValue.textContent = gamesCharacteristic ? "console avant v2.20" : "—";
                return;
            }
            speedSlider.disabled = false;
            if (Date.now() - volumeTouchedAt < 1500) {
                return;   /* réglage en cours : la console va suivre */
            }
            speedSlider.value = String(v);
            speedValue.textContent = v + " %";
        }

        /* ÉCRAN ALLUMÉ tant que la manette est connectée (Screen
           Wake Lock ; refusé sans conséquence par un navigateur qui ne le
           propose pas). Le système le relâche quand la page est cachée : il
           est redemandé à son retour. */
        let wakeLock = null;

        async function keepScreenOn(on) {
            if (!("wakeLock" in navigator)) {
                return;
            }
            try {
                if (on && !wakeLock && document.visibilityState === "visible") {
                    wakeLock = await navigator.wakeLock.request("screen");
                    wakeLock.addEventListener("release", () => { wakeLock = null; });
                    log("Écran maintenu allumé pendant la connexion.");
                } else if (!on && wakeLock) {
                    const w = wakeLock;
                    wakeLock = null;
                    await w.release();
                }
            } catch (error) {
                wakeLock = null;
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible" && linkConnected()) {
                keepScreenOn(true);
            }
        });

        /* =====================================================
           PORTRAIT / PAYSAGE
           ===================================================== */

        async function toggleOrientation() {
            isLandscapeMode = !isLandscapeMode;

            if (isLandscapeMode) {
                document.body.classList.add("landscape");
                orientationBtn.textContent = "🔄 PORTRAIT";

                try {
                    await document.documentElement.requestFullscreen?.();
                } catch (error) {
                    log("Plein écran non accordé par le navigateur.");
                }

            } else {
                document.body.classList.remove("landscape");
                orientationBtn.textContent = "🔄 PAYSAGE";

                try {
                    await document.exitFullscreen?.();
                } catch (error) {
                    /* Sans conséquence. */
                }
            }

            vibrate(20);
            playClickSound();
        }

        orientationBtn.addEventListener("click", toggleOrientation);
        backBtn.addEventListener("click", toggleOrientation);

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement && isLandscapeMode) {
                isLandscapeMode = false;
                document.body.classList.remove("landscape");
                orientationBtn.textContent = "🔄 PAYSAGE";
            }
        });

        /* =====================================================
           DÉCONNEXION ET SÉCURITÉ
           ===================================================== */

        function releaseAllButtons() {
            buttonUp = false;
            buttonDown = false;
            buttonLeft = false;
            buttonRight = false;

            buttonUpLeft = false;
            buttonUpRight = false;
            buttonDownLeft = false;
            buttonDownRight = false;

            buttonA = false;
            buttonB = false;
            buttonSelect = false;
            buttonStart = false;

            controllerButtons.forEach(button => {
                button.classList.remove("pressed");
            });
            dpadReset();   

            sendNesCommand(0x00);
            stopSending();
        }

        function quitApp() {
            const accepted = confirm(
                "Arrêter la manette et déconnecter l’ESP32 ?"
            );

            if (!accepted) {
                return;
            }

            stopAutoReconnect("quit");  /* Pas de reconnexion après QUITTER */
            releaseAllButtons();

            if (connectedDevice?.gatt?.connected) {
                connectedDevice.gatt.disconnect();
            }

            if (document.fullscreenElement) {
                document.exitFullscreen?.();
            }

            statusDiv.textContent = "Manette arrêtée";
            log("Manette arrêtée. ESP32 déconnecté.");
        }

        quitBtn.addEventListener("click", quitApp);
        quitBtnFloat.addEventListener("click", quitApp);

        /* =====================================================
           BOUTONS DE CONNEXION
           ===================================================== */

        scanBtn.addEventListener("click", () => {
            prepareAudio();
            vibrate(20);
            playClickSound();
            scanAllBLE();
        });

        connectBtn.addEventListener("click", () => {
            prepareAudio();
            vibrate(20);
            playClickSound();
            scanESP32();
        });

        /* =====================================================
           PROTECTION EN CAS DE PERTE DE FOCUS
           ===================================================== */

        window.addEventListener("blur", () => {
            releaseAllButtons();
        });

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                releaseAllButtons();
            }
        });

        document.addEventListener(
            "touchmove",
            event => {
                if (document.body.classList.contains("landscape")) {
                    event.preventDefault();
                }
            },
            { passive: false }
        );

        /* =====================================================
           BOUTON « MENU JEUX »
           Retour à l'écran de sélection des jeux de la console.
           - Trame [0xFD, 0x01, 0x00] : 0xFD = commande système,
             0x01 = MENU ; le 0x00 final fait qu'un firmware plus
             ancien (qui lit le dernier octet comme état de manette)
             n'y voit qu'un relâchement.
           - Deux appuis : le premier arme le bouton (« CONFIRMER ? »
             pendant 2,5 s), le second envoie la commande.
           - Pendant une partie, la console redémarre pour revenir au
             menu : elle coupe la liaison, que la page rétablit seule
             (voir la reconnexion automatique plus bas).
           ===================================================== */

        const MENU_LABEL = "🏠 MENU JEUX";
        const MENU_CONFIRM_LABEL = "🏠 CONFIRMER ?";
        const MENU_CONFIRM_MS = 2500;
        const MENU_DISCONNECT_WINDOW_MS = 15000;

        const menuRow = document.getElementById("menuRow");
        const menuButtons = [
            document.getElementById("menuBtn"),
            document.getElementById("menuBtnFloat")
        ];

        let menuArmedUntil = 0;
        let menuArmTimer = null;
        let menuDisconnectDeadline = 0;  /* coupure attendue après MENU */

        function setMenuLabels(text) {
            menuButtons.forEach(button => {
                button.textContent = text;
            });
        }

        function disarmMenu() {
            menuArmedUntil = 0;
            clearTimeout(menuArmTimer);
            menuArmTimer = null;
            setMenuLabels(MENU_LABEL);
        }

        function onMenuButton(event) {
            event.preventDefault();
            prepareAudio();
            playClickSound();

            if (
                !nesCharacteristic ||
                !connectedDevice ||
                !connectedDevice.gatt ||
                !connectedDevice.gatt.connected
            ) {
                disarmMenu();
                statusDiv.textContent = "MENU : ESP32 non connecté";
                log("MENU ignoré : ESP32 non connecté.");
                vibrate([60, 40, 60]);
                return;
            }

            /* La liste des jeux
               s'ouvre sur le téléphone (un seul appui, rien ne s'arrête). */
            if (gamesCharacteristic) {
                disarmMenu();
                /* Sortie Téléviseur de la console : la liste
                   s'ouvre sur la télévision (jeu en pause) et la manette
                   reste affichée pour la parcourir ; un second appui la
                   referme. */
                if (gpConsole.tv) {
                    gpQueue([0xFD, 0x06, 0x00]);
                    vibrate(20);
                    playClickSound();
                    log("MENU JEUX : liste des jeux sur la télévision (croix, A/START : lancer, B : reprendre).");
                    return;
                }
                gpOpen();
                return;
            }

            if (Date.now() > menuArmedUntil) {
                /* Premier appui : on arme le bouton. */
                menuArmedUntil = Date.now() + MENU_CONFIRM_MS;
                setMenuLabels(MENU_CONFIRM_LABEL);
                clearTimeout(menuArmTimer);
                menuArmTimer = setTimeout(disarmMenu, MENU_CONFIRM_MS);
                statusDiv.textContent = "Appuyez encore sur MENU pour confirmer";
                vibrate(30);
                return;
            }

            /* Second appui dans le délai : envoi. */
            disarmMenu();

            /* La console va redémarrer si une partie est en cours : la
               coupure qui suit n'est pas une perte de liaison. */
            menuDisconnectDeadline = Date.now() + MENU_DISCONNECT_WINDOW_MS;

            pendingMenuCommand = true;
            processGattQueue();

            statusDiv.textContent = "Retour à la liste des jeux...";
            log("MENU : retour à l'écran de sélection des jeux.");
            vibrate([40, 30, 90]);
        }

        menuButtons.forEach(button => {
            button.addEventListener("click", onMenuButton);
        });

        /*
         * Le bouton du mode portrait (sous la manette) est masqué en
         * paysage, où le bouton flottant prend le relais.
         */
        function syncMenuRow() {
            menuRow.hidden = document.body.classList.contains("landscape");
        }

        new MutationObserver(syncMenuRow).observe(document.body, {
            attributes: true,
            attributeFilter: ["class"]
        });

        syncMenuRow();

        /* =====================================================
           VOYANT DE LIAISON BLUETOOTH
           - Toutes les secondes, la trame [0xFD, 0x02, 0x00] est écrite
             AVEC accusé de réception : la console l'ignore, mais son
             accusé prouve que la liaison fonctionne de bout en bout.
           - Voyant (sous la manette en portrait, en haut au centre en
             paysage) :
               vert      « Bluetooth actif »
               orange    « Pas de réponse » (aucun accusé depuis 2,5 s)
                         ou « Reconnexion… » (clignotant)
               rouge     « Liaison perdue »
               gris      « Non connecté »
           - Liaison coupée sans QUITTER ni MENU : vibration, puis
             reconnexion automatique au même ESP32 (essai toutes les 2 s
             pendant 1 minute ; SCAN, CONNECTER ou QUITTER l'arrêtent).
             Après MENU, même reconnexion, sans alerte.
           ===================================================== */

        const PING_PERIOD_MS = 1000;
        const PING_LATE_MS = 2500;
        const RECONNECT_WINDOW_MS = 60000;
        const RECONNECT_DELAY_MS = 2000;

        const LINK_LOOK = {
            ok:           { color: "#2ecc71", text: "Bluetooth actif", blink: false },
            noanswer:     { color: "#f5a623", text: "Pas de réponse", blink: true },
            reconnecting: { color: "#f5a623", text: "Reconnexion…", blink: true },
            lost:         { color: "#e74c3c", text: "Liaison perdue", blink: false },
            off:          { color: "#8a8a8a", text: "Non connecté", blink: false }
        };

        const linkLeds = ["linkLed", "linkLedFloat"].map(id => {
            const el = document.getElementById(id);
            return {
                dot: el.querySelector("[data-led-dot]"),
                text: el.querySelector("[data-led-text]"),
                anim: null
            };
        });

        let linkDevice = null;   /* appareil de la liaison en cours */
        let linkLost = false;    /* liaison coupée sans QUITTER */
        let linkQuit = false;    /* QUITTER : ni alerte ni reconnexion */
        let lastPingAck = 0;
        let lastPingSent = 0;
        let linkShown = "";

        let reconnectDevice = null;         /* ESP32 à reconnecter */
        let reconnectGen = 0;               /* change à chaque arrêt */
        let reconnectAttemptDevice = null;  /* tentative en cours */
        let reconnectTimer = null;
        let reconnectGiveUpTimer = null;
        let reconnectStopReason = "";

        function linkConnected() {
            return Boolean(
                nesCharacteristic &&
                connectedDevice &&
                connectedDevice === linkDevice &&
                connectedDevice.gatt &&
                connectedDevice.gatt.connected
            );
        }

        function linkState() {
            if (linkConnected()) {
                return Date.now() - lastPingAck <= PING_LATE_MS ? "ok" : "noanswer";
            }

            if (reconnectDevice) {
                return "reconnecting";
            }

            return linkLost ? "lost" : "off";
        }

        function updateLinkLed() {
            const state = linkState();

            if (state === linkShown) {
                return;
            }

            const previous = linkShown;
            const look = LINK_LOOK[state];
            linkShown = state;

            /* Un seul bouton, qui montre l'état de la liaison */
            connectBtn.classList.toggle("is-connected", state === "ok" || state === "noanswer");
            connectBtn.textContent = state === "ok" || state === "noanswer" ? "✅ CONNECTÉ"
                : state === "reconnecting" ? "⏳ RECONNEXION…" : "🔗 CONNECTER";
            keepScreenOn(state === "ok" || state === "noanswer");
            if (state === "off" || state === "lost") {
                showConsoleVolume(null);
            }

            linkLeds.forEach(led => {
                led.dot.style.background = look.color;
                led.dot.style.boxShadow =
                    state === "off" ? "none" : "0 0 6px " + look.color;
                led.text.textContent = look.text;

                if (led.anim) {
                    led.anim.cancel();
                    led.anim = null;
                }

                if (look.blink && typeof led.dot.animate === "function") {
                    led.anim = led.dot.animate(
                        [{ opacity: 1 }, { opacity: 0.25 }],
                        { duration: 450, iterations: Infinity, direction: "alternate" }
                    );
                }
            });

            if (state === "noanswer" && previous === "ok") {
                log("Bluetooth : l'ESP32 ne répond plus.");
                vibrate(150);
            }
        }

        /* Appelée par connectToDevice() quand la liaison est prête. */
        function onLinkUp(device) {
            linkDevice = device;
            linkLost = false;
            linkQuit = false;
            lastPingAck = Date.now();
            lastPingSent = 0;
            device.addEventListener("gattserverdisconnected", onLinkDown, { once: true });
            updateLinkLed();
            gpOnLinkUp();   /* Panneau des jeux ouvert, liste redemandée */
        }

        function onLinkDown(event) {
            const device = event.target;

            if (device !== linkDevice) {
                return;  /* ancien appareil : sans objet */
            }

            linkDevice = null;

            if (linkQuit) {
                linkLost = false;
                updateLinkLed();
                return;
            }

            const expected = Date.now() <= menuDisconnectDeadline;
            menuDisconnectDeadline = 0;

            if (expected) {
                log("Console en redémarrage : reconnexion automatique...");
            } else {
                linkLost = true;
                log("Liaison Bluetooth perdue : reconnexion automatique...");
                vibrate([250, 120, 250]);
            }

            startAutoReconnect(device);
        }

        function startAutoReconnect(device) {
            if (reconnectDevice) {
                return;  /* déjà en cours */
            }

            reconnectDevice = device;
            const gen = reconnectGen;

            reconnectGiveUpTimer = setTimeout(() => {
                log("Reconnexion abandonnée : utilisez CONNECTER.");
                statusDiv.textContent = "Reconnexion impossible";
                linkLost = true;
                stopAutoReconnect("timeout");
            }, RECONNECT_WINDOW_MS);

            reconnectTimer = setTimeout(
                () => tryAutoReconnect(gen),
                RECONNECT_DELAY_MS
            );

            updateLinkLed();
        }

        async function tryAutoReconnect(gen) {
            reconnectTimer = null;

            if (gen !== reconnectGen || !reconnectDevice) {
                return;
            }

            if (connectedDevice) {
                /* Déjà reconnectée. */
                stopAutoReconnect("done");
                return;
            }

            const device = reconnectDevice;
            reconnectAttemptDevice = device;
            await connectToDevice(device);
            reconnectAttemptDevice = null;

            if (gen !== reconnectGen) {
                /* Arrêtée pendant la tentative. */
                if (reconnectStopReason === "quit") {
                    /* QUITTER : on ne garde aucune liaison. */
                    if (connectedDevice === device) {
                        device.gatt.disconnect();
                        resetConnection();
                    }
                    statusDiv.textContent = "Manette arrêtée";
                } else if (reconnectStopReason === "timeout") {
                    statusDiv.textContent = "Reconnexion impossible";
                }
                updateLinkLed();
                return;
            }

            if (connectedDevice) {
                stopAutoReconnect("done");
            } else {
                reconnectTimer = setTimeout(
                    () => tryAutoReconnect(gen),
                    RECONNECT_DELAY_MS
                );
            }
        }

        /*
         * reason : "done" (reconnectée), "quit" (QUITTER), "manual"
         * (SCAN ou CONNECTER), "timeout" (délai dépassé).
         */
        function stopAutoReconnect(reason) {
            reconnectGen++;
            reconnectStopReason = reason;
            reconnectDevice = null;
            clearTimeout(reconnectTimer);
            clearTimeout(reconnectGiveUpTimer);
            reconnectTimer = null;
            reconnectGiveUpTimer = null;

            if (reason === "quit") {
                linkQuit = true;
                linkLost = false;
            }

            if (reconnectAttemptDevice && reason !== "done") {
                /* Interrompt la tentative en cours (son connect() échoue). */
                reconnectAttemptDevice.gatt.disconnect();
            }

            updateLinkLed();
        }

        /*
         * Une connexion choisie à la main arrête la reconnexion
         * automatique (QUITTER l'arrête aussi, dans quitApp).
         */
        scanBtn.addEventListener("click", () => stopAutoReconnect("manual"));
        connectBtn.addEventListener("click", () => stopAutoReconnect("manual"));

        /* Contrôle de liaison et mise à jour du voyant. */
        function linkTick() {
            if (
                linkConnected() &&
                !pendingPing &&
                !pingInFlight &&
                Date.now() - lastPingSent >= PING_PERIOD_MS
            ) {
                pendingPing = true;
                lastPingSent = Date.now();
                processGattQueue();
            }

            updateLinkLed();
        }

        setInterval(linkTick, 500);
        updateLinkLed();

        /* =====================================================
           LISTE DES JEUX DE LA CONSOLE
           - MENU JEUX ouvre ce panneau en un
             seul appui : la partie en cours se met en pause et la liste
             arrive par la caractéristique FFF2 (notifications).
           - LANCER : la console change de jeu SANS REDÉMARRER ; la
             liaison Bluetooth et le plein écran restent, le panneau se
             ferme dès que le nouveau jeu tourne.
           - FERMER : reprise de la partie.
           - MENU DE LA CONSOLE : l'ancien MENU JEUX (deux appuis) ; en
             partie, la console redémarre sur sa liste des jeux.
           Format des messages de la console : games_link.h.
           ===================================================== */

        const gpPanel = document.getElementById("gamesPanel");
        const gpList = document.getElementById("gpList");
        const gpState = document.getElementById("gpState");
        const gpMsg = document.getElementById("gpMsg");
        const gpLaunchBtn = document.getElementById("gpLaunch");
        const gpCloseBtn = document.getElementById("gpClose");
        const gpConsoleBtn = document.getElementById("gpConsoleMenu");
        const gpSearch = document.getElementById("gpSearch");   
        const gpChips = document.getElementById("gpChips");     
        const gpResumeBtn = document.getElementById("gpResume");
        const gpSheet = gpPanel.querySelector(".gp-sheet");

        const GP_REFUSE_TEXT = {
            1: "La liste a changé sur la console : elle est rechargée, choisissez de nouveau.",
            2: "Jeu inconnu de la console.",
            3: "Fichier introuvable ou illisible.",
            4: "Ce fichier n'est pas une ROM NES, ou il est incomplet.",
            5: "Mapper {d} non pris en charge par l'émulateur.",
            6: "Le jeu n'a pas pu être chargé : retour au jeu précédent."
        };
        const GP_LOAD_FAILED_MENU_TEXT = "Le jeu n'a pas pu être chargé : la console revient à son menu.";

        let gpOpenFlag = false;
        let gpGames = [];           /* { name, label, key, where, kb, bad } */
        let gpGen = -1;             /* génération de la liste affichée (-1 : pas utilisable pour lancer) */
        /* "cat" = liste COMPLÈTE (tous les jeux),
           "page" = page de 50 jeux affichée par la console. */
        let gpMode = "page";
        let gpCache = null;         /* Dernière liste complète reçue { gen, crc, games } */
        let gpGamesVersion = 0;     /* change à chaque nouvelle liste (reconstruction des lignes) */
        let gpListKey = null;
        let gpFilter = "";          /* Recherche du panneau */
        let gpFilterTimer = null;
        let gpScrollPending = false;   /* à l'ouverture : la liste montre le jeu en cours */
        let gpEmptyEl = null;
        let gpSelected = -1;
        let gpRx = null;            /* liste en cours de réception */
        let gpWaiting = false;      /* demande de liste sans réponse complète */
        let gpWaitingMode = "page";
        let gpRetries = 0;
        let gpConsole = {
            state: -1, current: -1, gen: -1, count: 0, tv: false,
            cat: false, catcur: -1, catgen: -1, total: 0   /* ÉTAT de 12 octets ou plus */
        };
        let gpLaunching = -1;       /* jeu demandé, réponse attendue */
        let gpLaunchTimer = null;
        let gpAsked = null;         /* dernier LANCER : { index, time } (réponse tardive) */
        let gpFallback = false;     /* échec de chargement : retour au jeu précédent attendu */
        let gpConsoleArmedUntil = 0;
        let gpConsoleTimer = null;
        let gpListTimer = null;
        /* Bibliothèque de la console (message 0x09), en numéros de
           la liste complète : { gen, fav: [], rec: [], favSet, resume, resumeState } */
        let gpLib = null;
        let gpLibRx = { fav: [], rec: [] };
        let gpLibVersion = 0;
